services:
  backend:
    build: .
    image: aistickers-backend:dev
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      PORT: "2002"
      DATA_DIR: /app/data
      ASSET_STORAGE_DRIVER: local
      ASSET_STORAGE_LOCAL_BASE_DIR: /app/data
    ports:
      - "127.0.0.1:2002:2002"
    volumes:
      - aistickers_dev_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2002/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # T05A: PostgreSQL for schema/migration work. Repositories still read/write
  # JSON until T05B — this service is provisioned ahead of that cutover.
  # Intentionally has NO "ports:" mapping: only reachable from other
  # containers on the compose network, never from the host or the internet.
  db:
    image: postgres:16-alpine
    # POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB come from .env.docker
    # (the official postgres image reads them directly from its own
    # environment; no compose-level interpolation is used here on purpose).
    env_file:
      - .env.docker
    volumes:
      - aistickers_dev_db:/var/lib/postgresql/data
    init: true
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      # "$$" escapes compose's own interpolation so the shell variables are
      # expanded inside the container, against the env injected by env_file.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional S3-compatible integration environment for T07. Credentials are
  # intentionally local dummy values and must never be reused in production.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["object-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - aistickers_dev_minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["object-storage"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/aistickers-private-assets &&
        mc anonymous set none local/aistickers-private-assets

volumes:
  aistickers_dev_data:
    name: aistickers_dev_data
  aistickers_dev_db:
    name: aistickers_dev_db
  aistickers_dev_minio:
    name: aistickers_dev_minio
