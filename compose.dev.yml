services:
  backend:
    build: .
    image: aistickers-backend:dev
    env_file:
      # The example keeps `docker compose config` usable in a clean checkout;
      # an ignored .env.docker, when present, overrides it for local runs.
      - path: .env.docker.example
        required: true
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: development
      PORT: "2002"
      DATA_DIR: /app/data
      ASSET_STORAGE_DRIVER: local
      ASSET_STORAGE_LOCAL_BASE_DIR: /app/data
      REDIS_URL: redis://redis:6379
    ports:
      # Apache proxies the public API to this loopback-only host port.
      # BACKEND_HOST_PORT can override 2002 for an isolated test deployment.
      - "127.0.0.1:${BACKEND_HOST_PORT:-2002}:2002"
    volumes:
      - aistickers_dev_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2002/health/ready').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The HTTP process only produces BullMQ jobs. It never starts a consumer.
  # Uses the image built by the backend service to avoid duplicate builds on
  # Docker engines without buildx.
  worker:
    image: aistickers-backend:dev
    command: ["npm", "run", "worker:generation"]
    env_file:
      - path: .env.docker.example
        required: true
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: development
      DATA_DIR: /app/data
      ASSET_STORAGE_DRIVER: local
      ASSET_STORAGE_LOCAL_BASE_DIR: /app/data
      REDIS_URL: redis://redis:6379
    volumes:
      - aistickers_dev_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL is the durable source of truth for production and worker jobs.
  # For local development and integration tests it is bound to 127.0.0.1 so the
  # host test runner can reach it; production must never expose the port.
  db:
    # Alpine 3.23/3.24 fails PostgreSQL bootstrap writes on older kernels with
    # EPERM (docker-library/postgres#1417). Keep 3.22 pinned until the host OS
    # and Docker engine are upgraded.
    image: postgres:16-alpine3.22
    ports:
      - "127.0.0.1:5432:5432"
    # POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB come from .env.docker
    # (the official postgres image reads them directly from its own
    # environment; no compose-level interpolation is used here on purpose).
    env_file:
      - path: .env.docker.example
        required: true
      - path: .env.docker
        required: false
    volumes:
      - aistickers_dev_db:/var/lib/postgresql/data
    init: true
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      # "$$" escapes compose's own interpolation so the shell variables are
      # expanded inside the container, against the env injected by env_file.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Durable BullMQ transport. Bound to 127.0.0.1 for local tests only;
  # production must keep Redis inside the private network.
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - aistickers_dev_redis:/data
    init: true
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional S3-compatible integration environment for T07. Credentials are
  # intentionally local dummy values and must never be reused in production.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["object-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - aistickers_dev_minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["object-storage"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/aistickers-private-assets &&
        mc anonymous set none local/aistickers-private-assets

volumes:
  aistickers_dev_data:
    name: aistickers_dev_data
  aistickers_dev_db:
    name: aistickers_dev_db
  aistickers_dev_redis:
    name: aistickers_dev_redis
  aistickers_dev_minio:
    name: aistickers_dev_minio
