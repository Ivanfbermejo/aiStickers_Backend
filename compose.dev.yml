services:
  backend:
    build: .
    image: aistickers-backend:dev
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      PORT: "22024"
      DATA_DIR: /app/data
    ports:
      - "22024:22024"
    volumes:
      - aistickers_dev_data:/app/data
    init: true
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:22024/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aistickers_dev_data:
    name: aistickers_dev_data
