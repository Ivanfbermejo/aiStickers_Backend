name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_ENV: test
  PORT: 2002
  JWT_SECRET: test_jwt_secret_minimum_32_chars_long
  CLIENT_SECRET: test_client_secret_minimum_32_chars
  CLIENT_ID: ai-stickers-test
  TELEGRAM_BOT_TOKEN: test-token
  DATA_DIR: ./tmp-data
  RUN_MINIO_INTEGRATION: "true"
  MINIO_ENDPOINT: http://127.0.0.1:9000
  MINIO_BUCKET: aistickers-private-assets
  MINIO_REGION: us-east-1
  MINIO_ACCESS_KEY_ID: minioadmin
  MINIO_SECRET_ACCESS_KEY: minioadmin123
  MINIO_IMAGE: minio/minio:RELEASE.2025-09-07T16-13-09Z
  MINIO_VOLUME: aistickers_ci_minio
  # T05A: real PostgreSQL for schema/migration tests (tests/integration/postgres).
  # PERSISTENCE_DRIVER stays 'json' for the app itself; only these tests use it.
  DATABASE_URL: postgresql://aistickers:aistickers_ci_password@localhost:5432/aistickers_test
  T08_DATABASE_URL: postgresql://aistickers:aistickers_ci_password@localhost:5432/aistickers_t08_test
  REDIS_URL: redis://localhost:6379
  GENERATION_QUEUE_ENABLED: "true"
  IMAGE_TAG: t11b-ci

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aistickers
          POSTGRES_PASSWORD: aistickers_ci_password
          POSTGRES_DB: aistickers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aistickers -d aistickers_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start MinIO with persistent volume
        run: |
          docker volume create "$MINIO_VOLUME"
          docker run --detach --name aistickers-ci-minio \
            --network host \
            --volume "$MINIO_VOLUME:/data" \
            --env MINIO_ROOT_USER="$MINIO_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$MINIO_SECRET_ACCESS_KEY" \
            "$MINIO_IMAGE" server /data
          until curl --fail --silent "$MINIO_ENDPOINT/minio/health/live"; do sleep 1; done

      - name: Initialize private MinIO bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:RELEASE.2025-08-13T08-35-41Z -c \
            "mc alias set local $MINIO_ENDPOINT $MINIO_ACCESS_KEY_ID $MINIO_SECRET_ACCESS_KEY &&
            mc mb --ignore-existing local/$MINIO_BUCKET &&
            mc anonymous set none local/$MINIO_BUCKET"

      - name: Syntax check
        run: node --check index.js

      - name: Prepare isolated T08 database
        run: createdb --host=localhost --username=aistickers aistickers_t08_test
        env:
          PGPASSWORD: aistickers_ci_password

      - name: Run tests
        run: npm test

      - name: Run the real restore drill
        run: npx vitest run --threads=false tests/integration/restore-drill.test.js

      - name: Verify MinIO volume survives service recreation
        run: |
          node scripts/minio-persistence-check.js --seed
          docker rm --force aistickers-ci-minio
          docker run --detach --name aistickers-ci-minio-recreated \
            --network host \
            --volume "$MINIO_VOLUME:/data" \
            --env MINIO_ROOT_USER="$MINIO_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$MINIO_SECRET_ACCESS_KEY" \
            "$MINIO_IMAGE" server /data
          until curl --fail --silent "$MINIO_ENDPOINT/minio/health/live"; do sleep 1; done
          node scripts/minio-persistence-check.js --verify

      - name: Start server and verify health
        run: node scripts/smoke-start.js

      - name: Run security scan
        run: node scripts/security-scan.js

      - name: Verify API contract
        run: node scripts/api-contract-check.js

      - name: Validate Compose files
        run: |
          docker compose -f compose.dev.yml config --quiet
          docker compose -f compose.production.example.yml config --quiet

      - name: Run production preflight with disposable values
        env:
          NODE_ENV: production
          PERSISTENCE_DRIVER: postgres
          DATABASE_URL: postgresql://preflight:preflight@db.example.test:5432/aistickers
          REDIS_URL: rediss://redis.example.test:6380
          ASSET_STORAGE_DRIVER: s3
          ASSET_STORAGE_BUCKET: preflight-bucket
          ASSET_STORAGE_REGION: eu-west-1
          ASSET_STORAGE_ENDPOINT: https://s3.example.test
          ASSET_STORAGE_ACCESS_KEY_ID: preflight-access-key
          ASSET_STORAGE_SECRET_ACCESS_KEY: preflight-secret-key
          JWT_SECRET: preflight-jwt-secret-with-at-least-32-characters
          CLIENT_ID: preflight-client
          CLIENT_SECRET: preflight-client-secret-with-at-least-32-chars
          GOOGLE_CLIENT_ID: preflight-google-client
          GOOGLE_CLIENT_SECRET: preflight-google-client-secret
          GOOGLE_PACKAGE_NAME: com.animatedsticker.aistickers
          GOOGLE_PLAY_SERVICE_ACCOUNT: '{"type":"service_account","project_id":"preflight-project","client_email":"preflight@example.test","private_key":"preflight-private-key"}'
          REPLICATE_API_TOKEN: preflight-replicate-token
          REPLICATE_MODEL: google/nano-banana
          REPLICATE_IMG2VID_MODEL: bytedance/seedance-1-pro
          CORS_ORIGINS: https://app.example.test
          HMAC_LEGACY_V1_ENABLED: "false"
          ENABLE_TEST_JWTS: "false"
          ENABLE_APPLE_PAYMENTS: "false"
          ENABLE_TELEGRAM: "false"
          ENABLE_WHATSAPP_EXPORT: "false"
          GENERATION_QUEUE_ENABLED: "true"
          METRICS_ENABLED: "false"
        run: npm run production:preflight

      - name: Build and smoke the production image
        run: node scripts/docker-production-smoke.js

      - name: Audit production dependencies
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit.json
          audit_status=$?
          set -e
          cat npm-audit.json
          exit "$audit_status"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
