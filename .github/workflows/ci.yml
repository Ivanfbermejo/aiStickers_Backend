name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_ENV: test
  PORT: 22024
  JWT_SECRET: test_jwt_secret_minimum_32_chars_long
  CLIENT_SECRET: test_client_secret_minimum_32_chars
  CLIENT_ID: ai-stickers-test
  TELEGRAM_BOT_TOKEN: test-token
  DATA_DIR: ./tmp-data
  # T05A: real PostgreSQL for schema/migration tests (tests/integration/postgres).
  # PERSISTENCE_DRIVER stays 'json' for the app itself; only these tests use it.
  DATABASE_URL: postgresql://aistickers:aistickers_ci_password@localhost:5432/aistickers_test

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aistickers
          POSTGRES_PASSWORD: aistickers_ci_password
          POSTGRES_DB: aistickers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aistickers -d aistickers_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check index.js

      - name: Run tests
        run: npm test

      - name: Start server and verify health
        run: node scripts/smoke-start.js

      - name: Run security scan
        run: node scripts/security-scan.js

      - name: Audit production dependencies
        run: npm audit --omit=dev --json > npm-audit.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
