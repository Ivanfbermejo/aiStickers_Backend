# Production reference configuration.
#
# Supply IMAGE_TAG with an immutable release tag or digest-derived tag before
# starting this stack. The example contains placeholders only; put real values
# in an untracked .env.production file or in the deployment secret store.

x-app-image: &app-image "aistickers-backend:${IMAGE_TAG:?IMAGE_TAG is required}"
x-common-environment: &common-environment
  NODE_ENV: production
  PORT: "2002"
  DATA_DIR: /app/runtime
  PERSISTENCE_DRIVER: postgres
  DATABASE_URL: "postgresql://${POSTGRES_USER:-aistickers}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-aistickers}"
  REDIS_URL: redis://redis:6379
  GENERATION_QUEUE_ENABLED: "true"
  GENERATION_QUEUE_CONCURRENCY: "2"
  GENERATION_QUEUE_ATTEMPTS: "5"
  GENERATION_QUEUE_SHUTDOWN_TIMEOUT_MS: "30000"
  ASSET_STORAGE_DRIVER: s3
  ASSET_STORAGE_BUCKET: "${ASSET_STORAGE_BUCKET:-aistickers-private-assets}"
  ASSET_STORAGE_REGION: "${ASSET_STORAGE_REGION:-us-east-1}"
  ASSET_STORAGE_ENDPOINT: "${ASSET_STORAGE_ENDPOINT:-https://s3.example.com}"
  ASSET_STORAGE_ACCESS_KEY_ID: "${ASSET_STORAGE_ACCESS_KEY_ID:-}"
  ASSET_STORAGE_SECRET_ACCESS_KEY: "${ASSET_STORAGE_SECRET_ACCESS_KEY:-}"
  ASSET_STORAGE_FORCE_PATH_STYLE: "${ASSET_STORAGE_FORCE_PATH_STYLE:-false}"
  JWT_SECRET: "${JWT_SECRET:-}"
  JWT_ISSUER: "${JWT_ISSUER:-aiStickers}"
  JWT_AUDIENCE: "${JWT_AUDIENCE:-aiStickers-backend}"
  CLIENT_ID: "${CLIENT_ID:-ai-stickers}"
  CLIENT_SECRET: "${CLIENT_SECRET:-}"
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
  GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
  GOOGLE_PACKAGE_NAME: "${GOOGLE_PACKAGE_NAME:-com.animatedsticker.aistickers}"
  GOOGLE_PLAY_SERVICE_ACCOUNT: "${GOOGLE_PLAY_SERVICE_ACCOUNT:-}"
  REPLICATE_API_TOKEN: "${REPLICATE_API_TOKEN:-}"
  REPLICATE_MODEL: "${REPLICATE_MODEL:-google/nano-banana}"
  REPLICATE_IMG2VID_MODEL: "${REPLICATE_IMG2VID_MODEL:-bytedance/seedance-1-pro}"
  CORS_ORIGINS: "${CORS_ORIGINS:-https://app.example.com}"
  HMAC_LEGACY_V1_ENABLED: "false"
  ENABLE_APPLE_PAYMENTS: "false"
  ENABLE_TELEGRAM: "false"
  ENABLE_WHATSAPP_EXPORT: "false"
  ENABLE_EXTERNAL_IMAGE_URLS: "false"
  ENABLE_TEST_JWTS: "false"
  METRICS_ENABLED: "${METRICS_ENABLED:-false}"
  METRICS_BEARER_TOKEN: "${METRICS_BEARER_TOKEN:-}"

services:
  postgres:
    image: "postgres:16-alpine3.22"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-aistickers}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      POSTGRES_DB: "${POSTGRES_DB:-aistickers}"
    volumes:
      - aistickers_production_postgres:/var/lib/postgresql/data
    init: true
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    image: "redis:7.4-alpine"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - aistickers_production_redis:/data
    init: true
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  migrate:
    image: *app-image
    command: ["npm", "run", "prisma:migrate:deploy"]
    environment:
      <<: *common-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    cpus: "1.0"
    mem_limit: 512m

  worker:
    image: *app-image
    command: ["node", "scripts/worker-generation.js"]
    environment:
      <<: *common-environment
    volumes:
      - aistickers_production_runtime:/app/runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  backend:
    image: *app-image
    environment:
      <<: *common-environment
    ports:
      - "127.0.0.1:22024:2002"
    volumes:
      - aistickers_production_runtime:/app/runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  aistickers_production_postgres:
    name: aistickers_production_postgres
  aistickers_production_redis:
    name: aistickers_production_redis
  aistickers_production_runtime:
    name: aistickers_production_runtime
